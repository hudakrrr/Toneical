name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libxcomposite-dev libxrender-dev libxi-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONEICAL_NATIVE=OFF

      - name: Build app, plugins and tests
        run: cmake --build build --target Toneical_Standalone Toneical_VST3 Toneical_LV2 ToneicalRenderTest

      - name: Offline render test (every pedal, amp and preset)
        run: ./build/ToneicalRenderTest_artefacts/Release/ToneicalRenderTest build/render-test
