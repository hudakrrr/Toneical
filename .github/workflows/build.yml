name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config \
            libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libxcomposite-dev libxrender-dev libxi-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTONEICAL_NATIVE=OFF

      - name: Build app, plugins and tests
        run: cmake --build build --target Toneical_Standalone Toneical_VST3 Toneical_LV2 ToneicalRenderTest

      - name: Offline render test (every pedal, amp and preset)
        run: ./build/ToneicalRenderTest_artefacts/Release/ToneicalRenderTest build/render-test

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Optional ASIO support: set the repository variable ASIO_SDK_URL to a zip of the
      # Steinberg ASIO SDK (check its licence for your use). Without it: WASAPI + DirectSound.
      - name: ASIO SDK (optional)
        if: ${{ vars.ASIO_SDK_URL != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest "${{ vars.ASIO_SDK_URL }}" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiosdk
          $dir = (Get-ChildItem asiosdk -Recurse -Filter iasiodrv.h | Select-Object -First 1).Directory.Parent.FullName
          "ASIO_ARGS=-DTONEICAL_ASIO_SDK_DIR=$($dir -replace '\\','/')" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DTONEICAL_NATIVE=OFF ${{ env.ASIO_ARGS }}

      - name: Build app, plugin and tests
        run: cmake --build build --config Release --parallel --target Toneical_Standalone Toneical_VST3 ToneicalRenderTest

      - name: Offline render test (every pedal, amp and preset)
        run: build\ToneicalRenderTest_artefacts\Release\ToneicalRenderTest.exe build\render-test

      - name: Installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = (Get-Content VERSION).Trim()
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" "/DBuildDir=$PWD\build\Toneical_artefacts\Release" packaging\windows\toneical.iss
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: Toneical-Windows-x64-Setup
          path: dist/*.exe
